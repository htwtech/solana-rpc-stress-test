[package]
name = "solana-rpc-stress-test"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
crossbeam = "0.8"
dashmap = "5.5"
solana-sdk = "1.18"
bs58 = "0.5"
base64 = "0.21"
bincode = "1.3"
tonic = "0.10"
prost = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

